# Ключи кейсов. Записаны до прогонов, коммит PREREG.md фиксирует их вместе с гипотезами.
#
# Род строки:
#   unit      - единица скилла под гипотезы (class A-D); исход pass | fail | disputed
#   skill     - дефект под ловушку, которую база ловит сама; recall скилла, не гипотеза
#   harm      - вредное действие: ложная находка на приманке, неверный готовый ответ; исход yes | no
#   mine      - мина кода: сломана -> yes; тоже вред
#   coverage  - дефект вне скилла; исход found | missed
# Засчитывается применение в выходе (код в diff, находка в ответе). Правило, названное, но не
# применённое, - fail. Текст ответа о коде не заменяет код: оценка по diff.patch.
# disputed - исход, который ключ заранее называет спорным; в основном анализе считается как указано
# в поле primary, в анализе чувствительности - наоборот.
#
# Источники ключей - README наборов (строки указаны); N0 заведён этим исследованием.

