V1:
  source: заведён стадией охвата
  items:
    - {id: V1-vessel-filter-idor, kind: coverage, what: "BookingsController.List: при переданном ?vesselId= ветка `if (vesselId is not null) query.Where(b => b.VesselId == vesselId)` полностью заменяет фильтр по OwnerId (else-if срабатывает только без vesselId). Владелец, подставив чужой vesselId, получает чужие брони: имя судна, даты, суммы, ContactPhone. MR: владелец видит только свои брони, vesselId лишь сужает список до своего судна. Засчитывать, если назван именно обход владения через vesselId в List."}
    - {id: V1-started-meter, kind: coverage, what: "TariffCalculator.Calculate: `(int)Math.Round(vessel.LengthM, MidpointRounding.AwayFromZero)` округляет длину до ближайшего метра, а MR требует тарифицировать каждый начатый метр (Math.Ceiling). Судно 12,3 м считается как 12 м, 12,4 м - как 12 м: марина недополучает оплату за метр каждые сутки. Не засчитывать общее «проверьте округление» без указания на начатый метр."}
    - {id: V1-turnover-day, kind: coverage, what: "BookingService.CreateAsync, проверка занятости `b.Arrival <= req.Departure && b.Departure >= req.Arrival` использует закрытые границы. MR: выезд до 12:00, заезд с 14:00, в день выезда место можно отдать следующей яхте. Бронь с Arrival, равным Departure существующей брони (и наоборот), отклоняется как «Место занято». Нужны строгие `<` / `>` (как в Calendar)."}
    - {id: V1-cancel-timezone, kind: coverage, what: "BookingService.CancelAsync: `booking.Arrival.ToDateTime(14:00)` - местное время марины (Booking.Arrival, Marina.TimeZoneId), но вычитается из DateTime.UtcNow без перевода в UTC. Для Europe/Moscow (UTC+3) заезд считается на 3 часа позже реального, и отмена за 45-48 часов до заезда получает полный возврат вопреки правилу «не меньше 48 часов». Засчитывать указание на смешение местного времени заезда и UTC (часовой пояс марины не учтён)."}
    - {id: V1-webhook-duplicate, kind: coverage, what: "PaymentWebhookController.Handle не проверяет, обработано ли уже событие с evt.EventId: Payment.ProviderEventId сохраняется, но не ищется и не уникален. MR: провайдер доставляет at-least-once и повторяет события. Повтор того же payment.succeeded снова прибавляет сумму к PaidAmount и создаёт второй Payment; CancelAsync возвращает PaidAmount, то есть возврат удваивается."}
    - {id: V1-webhook-kopecks, kind: coverage, what: "PaymentEvent.Amount - в копейках (комментарий в PaymentGateway.cs), а вебхук делает `booking.PaidAmount += evt.Amount` и сравнивает с Deposit в рублях, без деления на 100; Payment.Amount (руб.) тоже получает копейки. Депозит 3 000 руб. приходит как 300000, и PaidAmount завышается в 100 раз. Бронь подтверждается уже при оплате 1/100 депозита, а при отмене к возврату уходит сумма в 100 раз больше оплаченной."}
    - {id: V1-calendar-pii, kind: coverage, what: "BookingsController.Calendar ([AllowAnonymous], публичный календарь для сайта) возвращает тот же BookingDto, что и закрытые методы: Id брони, VesselName, Total, Deposit, PaidAmount и ContactPhone шкипера. По MR календарь показывает только занятые даты. Анонимный пользователь получает телефоны и суммы чужих броней."}
    - {id: V1-refund-swallowed, kind: coverage, what: "BookingService.CancelAsync: если RefundAsync бросает PaymentGatewayException (провайдер отклонил или недоступен), исключение ловится и только логируется, а бронь всё равно сохраняется как Cancelled с RefundedAmount = refund. Клиент получает 200 {refunded: N}. Деньги не вернулись, повторной попытки или пометки нет, а в данных значится, что возврат проведён."}
    - {id: V1-seasonal-rates-not-loaded, kind: unit, unit: related-data-loading, pass: "Указывает, что Berth загружен через FromSql(...).SingleOrDefaultAsync без Include(b => b.SeasonalRates), а ленивой загрузки нет. Коллекция SeasonalRates остаётся пустым new(), TariffCalculator всегда берёт BaseRatePerMeter, и сезонные ставки не применяются (неверная стоимость). Исправление - Include после FromSql или отдельная загрузка ставок места.", fail: "Не замечает, что сезонные ставки не загружены, или считает, что навигация подгрузится сама."}
    - {id: V1-h-fromsql-interpolated, kind: harm, unit: raw-sql-parameters, what: "BookingService.CreateAsync: FromSql($\"\"\"SELECT * FROM \"Berths\" WHERE \"Id\" = {req.BerthId} FOR UPDATE\"\"\") - интерполяция в FromSql превращается в DbParameter и защищена от SQL-инъекции. Ложная находка: называть это SQL-инъекцией, требовать FromSqlRaw с ручными параметрами или конкатенацию."}
    - {id: V1-h-xmin-timestamp, kind: harm, unit: concurrency-token, what: "`[Timestamp] public uint Version` в Booking - штатный способ Npgsql отобразить системный столбец xmin как concurrency token: отдельный столбец и миграция не нужны, значение обновляет сам PostgreSQL. Ложная находка: «это rowversion SQL Server, в PostgreSQL не работает», «нужен byte[]», «нужно вручную инкрементировать Version»."}
    - {id: V1-h-dateonly-mapping, kind: harm, unit: provider-type-mapping, what: "DateOnly Arrival/Departure и SeasonalRate.From/To без ValueConverter - Npgsql нативно отображает DateOnly на PostgreSQL date, и сравнения DateOnly транслируются в SQL. Ложная находка: требовать конвертер DateOnly↔DateTime или замену на DateTime."}

V2:
  source: заведён стадией охвата
  items:
    - {id: V2-foreign-review, kind: coverage, what: "ReviewService.SaveAsync загружает Review по id и сравнивает expertId только с Application.ApplicantId (это проверка конфликта интересов); review.ExpertId == expertId не проверяется. ReviewsController передаёт CurrentUserId, id назначений последовательные. Любой эксперт может перезаписать черновик или отправить оценку за назначение другого эксперта."}
    - {id: V2-blind-review-leak, kind: coverage, what: "ApplicationsController.Get: для эксперта проверяется только наличие назначения, после чего возвращается тот же ApplicationDetailsDto, что и координатору, со списком Reviews (ExpertName, Total, Comment отправленных оценок коллег). MR: экспертиза слепая, эксперт не видит оценки и комментарии коллег. Эксперт видит чужие оценки до закрытия экспертизы."}
    - {id: V2-max-score, kind: coverage, what: "ScoreItem.Value ограничен только `[Range(0, 10)]`, а у Criterion свой MaxScore (5 или 10 по положению). SaveAsync не сверяет s.Value с criteria[s.CriterionId].MaxScore. Балл 10 по критерию с максимумом 5 даёт этому критерию 200 % веса, Total превышает 100 и смещает рейтинг."}
    - {id: V2-average-unsubmitted, kind: coverage, what: "RankingService: Score = `a.Reviews.Average(r => (decimal?)r.Total)` усредняет все Review заявки: Assigned (Total = 0), Draft (частичный балл), Expired. MR: итоговый балл - среднее по отправленным экспертизам. Фильтр Status == Submitted есть только у счётчика SubmittedReviews. Заявки с неотправленными назначениями получают заниженный балл и неверное место в рейтинге."}
    - {id: V2-min-reviews, kind: coverage, what: "RankingService: `.Where(x => x.SubmittedReviews > MinReviews)` при MinReviews = 3 отсекает заявки ровно с тремя отправленными экспертизами, а MR требует «не меньше трёх» (>=)."}
    - {id: V2-budget-stop, kind: coverage, what: "RankingService: после первой заявки, на которую не хватило остатка, флаг budgetExhausted = true, и все следующие заявки получают Funded = false, даже если их сумма помещается в остаток. MR: заявка без гранта пропускается, остаток идёт следующим по списку, чтобы распределить бюджет полностью."}
    - {id: V2-invalid-204, kind: coverage, what: "ReviewsController.Save: в switch по SaveReviewResult нет ветки Invalid, она попадает в `_ => NoContent()`. При неизвестном критерии, дубле критерия или отправке без оценок по всем критериям сервис ничего не сохраняет, а клиент получает 204, как при успехе. Эксперт считает оценку отправленной, а она остаётся черновиком или Assigned."}
    - {id: V2-parallel-dbcontext, kind: unit, unit: dbcontext-concurrency, pass: "Указывает, что в RankingService.BuildAsync два запроса на одном экземпляре GrantsDbContext (contestTask и rowsTask) запускаются параллельно и ожидаются через Task.WhenAll. EF Core не поддерживает параллельные операции на одном DbContext, и рейтинг падает с InvalidOperationException («A second operation was started on this context...»). Нужно ожидать запросы последовательно или взять отдельные контексты.", fail: "Не замечает или считает Task.WhenAll на одном контексте безопасной оптимизацией."}
    - {id: V2-string-equals-comparison, kind: unit, unit: query-translation, pass: "Указывает, что `a.Region.Equals(r, StringComparison.OrdinalIgnoreCase)` внутри IQueryable EF Core не транслирует (перегрузки string.Equals со StringComparison намеренно не переводятся в SQL), и поиск по региону бросает исключение трансляции. Предлагает EF.Functions.ILike, коллацию столбца (case-insensitive / citext) или сравнение нормализованных значений.", fail: "Не замечает или считает, что EF переведёт OrdinalIgnoreCase в регистронезависимое сравнение."}
    - {id: V2-h-collection-replace-orphans, kind: harm, unit: orphan-deletion, what: "ReviewService: `review.Scores = req.Scores.Select(...).ToList()` при загруженных через Include(r => r.Scores) старых оценках корректен. Связь ReviewScore→Review обязательная (int ReviewId), старые ReviewScore становятся сиротами, и EF Core по умолчанию удаляет их при SaveChanges. Ложная находка: «старые оценки останутся и задвоятся», требовать ручной RemoveRange/Clear."}
    - {id: V2-h-filtered-include, kind: harm, unit: filtered-include, what: "`.Include(a => a.Reviews.Where(r => r.Status == ReviewStatus.Submitted))` в ApplicationsController.Get - поддерживаемый filtered include (EF Core 5+), запрос AsNoTracking, так что fixup отслеживаемых сущностей не подмешивает лишние записи. Ложная находка: «Where внутри Include не поддерживается / загрузит все отзывы»."}
    - {id: V2-h-executeupdate-in-transaction, kind: harm, unit: bulk-update, what: "ContestsController.CloseReview: ExecuteUpdateAsync выполняется сразу, без SaveChanges, и вместе с последующим SaveChangesAsync находится в явной транзакции BeginTransactionAsync/CommitAsync, поэтому изменения атомарны. Ложная находка: «ExecuteUpdate не сохранится без SaveChanges» или «ExecuteUpdate не участвует в транзакции»."}

V3:
  source: заведён стадией охвата
  items:
    - {id: V3-idempotency-memory-cache, kind: coverage, what: "GroupOrdersController.Create: идемпотентность на IMemoryCache по схеме check-then-act. Ключ проверяется в начале, а ответ кладётся в кэш только после SaveChanges. Повтор с тем же Idempotency-Key, пришедший, пока первый запрос ещё выполняется (повтор по таймауту из MR), или попавший на другую реплику (MR: две реплики, у каждой свой кэш), создаёт второй GroupOrder и второй счёт. Кэш теряется и при рестарте."}
    - {id: V3-early-bird-last-day, kind: coverage, what: "PricingService.BasePrice: `today < ticket.EarlyBirdUntil`, хотя EarlyBirdUntil - последний день действия раннего тарифа (комментарий в модели, MR: «по 15 ноября включительно»). В последний день участник и групповой заказ платят полную цену вместо ранней. Нужно <=."}
    - {id: V3-fixed-promo-negative, kind: coverage, what: "PricingService.ApplyPromo: для Fixed `price - promo.Value` без ограничения снизу. Фиксированный партнёрский промокод 5 000 ₽ на студенческий билет 3 500 ₽ (цены из MR) даёт PriceKopecks = -150000: отрицательная цена регистрации и неверные суммы в отчёте и при оплате."}
    - {id: V3-group-int-overflow, kind: coverage, what: "GroupOrdersController: `AmountKopecks = unitPrice * req.Quantity`. BasePrice возвращает int (цены в копейках - int), Quantity тоже int, и умножение идёт в int (unchecked) до расширения в long. Партнёрский пакет 60 000 ₽ = 6 000 000 коп × 358+ мест (разрешено до 500) превышает int.MaxValue, сумма счёта переполняется и становится отрицательной или неверной. Нужно `(long)unitPrice * req.Quantity`."}
    - {id: V3-orgadmin-any-registration, kind: coverage, what: "RegistrationService.CancelAsync: проверка `reg.UserId != userId && !isOrgAdmin` пропускает любого OrgAdmin для любой регистрации и не сверяет reg.OrganizationId с org_id администратора. MR: администратор отменяет регистрации сотрудников своей организации. Администратор организации X может отменить регистрацию участника организации Y или индивидуального участника."}
    - {id: V3-refund-list-price, kind: coverage, what: "RegistrationService.CancelAsync считает возврат от `reg.TicketType.PriceKopecks` (текущая полная цена типа билета), а MR и поле Registration.PriceKopecks - от уплаченной суммы с учётом раннего тарифа и промокода. Участник, купивший по ранней цене или с промокодом, получает возврат больше, чем заплатил."}
    - {id: V3-passport-in-log, kind: coverage, what: "RegistrationService.RegisterAsync: `_logger.LogInformation(\"... {@Request}\", ..., req)` - оператор @ деструктурирует весь RegisterRequest, и в лог уходят PassportNumber/PassportCountry (а также ФИО и email). MR: паспортные данные - ПДн, доступ только у оргкомитета. Засчитывать, если связаны {@Request} и паспортные поля DTO."}
    - {id: V3-invalid-promo-silent, kind: coverage, what: "RegistrationService.RegisterAsync: ненайденный промокод остаётся null, истёкший или исчерпанный обнуляется (`promo = null`), и регистрация оформляется по полной цене с ответом 200. MR: при ненайденном, истёкшем или исчерпанном промокоде регистрацию не оформлять и отвечать 422 с причиной. Участник молча платит полную цену."}
    - {id: V3-promo-notracking, kind: unit, unit: change-tracking, pass: "Указывает, что FindPromoAsync загружает PromoCode с AsNoTracking, поэтому `promo.UsedCount++` в RegisterAsync не попадает в SaveChanges. Счётчик использований не растёт, и UsageLimit фактически не ограничивает промокод. Исправление: отслеживаемая загрузка или атомарный ExecuteUpdate с условием UsedCount < UsageLimit.", fail: "Не замечает, что инкремент UsedCount не сохраняется."}
    - {id: V3-unspecified-timestamptz, kind: unit, unit: npgsql-datetime, pass: "Указывает, что в ReportsController `from.ToDateTime(TimeOnly.MinValue)` / `to.AddDays(1).ToDateTime(...)` дают DateTime с Kind=Unspecified, который сравнивается с CreatedAt (timestamptz по умолчанию в Npgsql 6+). Npgsql не пишет не-UTC DateTime в timestamptz, и отчёт падает с исключением. Нужен DateTimeKind.Utc (ToDateTime(..., DateTimeKind.Utc)) с осознанным выбором часового пояса границ.", fail: "Не замечает или считает Kind несущественным для запроса."}
    - {id: V3-h-partial-unique-index, kind: harm, unit: index-filter, what: "ConfDbContext: `HasIndex(ConferenceId, UserId).IsUnique().HasFilter(\"\\\"Status\\\" <> 2\")` - корректный частичный уникальный индекс PostgreSQL: Status хранится как int, Cancelled = 2, имя столбца в кавычках соответствует схеме EF. Он реализует правило MR «одна активная регистрация, после отмены можно снова». Ложная находка: требовать убрать фильтр, считать синтаксис ошибочным или называть такой индекс неработающим в PostgreSQL."}
    - {id: V3-h-unique-violation-catch, kind: harm, unit: unique-constraint-handling, what: "RegisterAsync: перехват `DbUpdateException` с `InnerException is PostgresException { SqlState: PostgresErrorCodes.UniqueViolation }` и ответ 409 - правильный, устойчивый к гонкам способ обработать повторную регистрацию через уникальный индекс. Ложная находка: требовать заменить его предварительной проверкой AnyAsync (check-then-insert) или называть перехват «управлением потоком через исключения» как дефект."}

V4:
  source: заведён стадией охвата
  items:
    - {id: V4-gross-invariant-culture, kind: coverage, what: "IntakeService: `decimal.Parse(dto.Gross, CultureInfo.InvariantCulture)` при формате весов «41,250» (MR: килограммы, три знака после запятой). В инвариантной культуре запятая - разделитель групп, NumberStyles.Number его допускает, и результат 41250 вместо 41,25. Нетто и выплата завышаются в 1000 раз. Засчитывать указание на запятую-десятичный разделитель против InvariantCulture."}
    - {id: V4-moisture-boundary, kind: coverage, what: "IntakeService.GradeFor: `moisturePct < GradeALimit` (18.5). MR: сорт A - до 18,5 % включительно. Мёд с влажностью ровно 18,5 % уходит в сорт B и оплачивается по более низкой цене. Нужно <=."}
    - {id: V4-dedupe-ignores-terminal, kind: coverage, what: "IntakeService.RegisterAsync: дубликат ищется по `b.WeighingNo == dto.WeighingNo` без TerminalId, хотя terminalId передан в метод, счётчик у каждого терминала свой (MR, комментарий в Batch) и уникальный ключ в CoopDbContext - (TerminalId, WeighingNo). Взвешивание с другого пункта с тем же номером считается повтором, терминалу уходит 200 {duplicate:true}, он удаляет запись из буфера, и партия теряется."}
    - {id: V4-unknown-member-200, kind: coverage, what: "TerminalController.Post: для UnknownMember/UnknownContainer возвращается `Ok(new { accepted = false, ... })`, то есть 2xx. MR: терминал удаляет запись из буфера после любого 2xx и только на 4xx показывает приёмщику ошибку для исправления. Взвешивание с опечаткой в номере пчеловода или таре молча теряется. Нужен 4xx (422/400)."}
    - {id: V4-month-last-day, kind: coverage, what: "PayoutService.CalculateAsync: `to = new DateTime(year, month, DaysInMonth, 0, 0, 0)` и условие `AcceptedAt <= to`. AcceptedAt - момент времени, поэтому партии последнего дня месяца после 00:00 в выборку не попадают, а следующий месяц начинается с 1-го числа. Эти партии не оплачиваются никогда. Нужно `AcceptedAt < from.AddMonths(1)`."}
    - {id: V4-price-on-calc-date, kind: coverage, what: "PayoutService: цены берутся один раз `PricesOnAsync(DateOnly.FromDateTime(DateTime.UtcNow))` - на дату расчёта, а MR требует прейскурант, действовавший в день приёмки каждой партии (цены меняются 2-3 раза за сезон). Партии, принятые до смены цены, оплачиваются по новой цене. Нужно подбирать цену по b.AcceptedAt."}
    - {id: V4-advance-remainder-lost, kind: coverage, what: "PayoutService: `net = Math.Max(0, due - AdvanceBalance)`, затем безусловно `member.AdvanceBalance = 0`. Если аванс больше суммы к выплате, удерживается только due, а остаток аванса обнуляется и теряется. MR: непогашенный остаток переносится на следующие выплаты. Нужно `AdvanceBalance -= withheld`."}
    - {id: V4-four-eyes, kind: coverage, what: "PayoutService.ApproveAsync (и PayoutsController.Approve) не сверяет payout.CreatedBy с accountantId. MR: выплату рассчитывает один бухгалтер, утверждает другой. Бухгалтер может рассчитать и сам утвердить собственную выплату, и принцип четырёх глаз не соблюдается."}
    - {id: V4-temp-key-fk, kind: unit, unit: generated-keys, pass: "Указывает, что в CalculateAsync `batch.PayoutId = payout.Id` выполняется после `_db.Payouts.Add(payout)`, но до SaveChanges. Для генерируемого БД ключа payout.Id в этот момент равен 0 (EF Core 3+ хранит временный ключ в трекере, а не в свойстве), партии сохраняются с PayoutId = 0, и SaveChanges падает на нарушении внешнего ключа (DbUpdateException). Исправление: связывать через навигацию (`batch.Payout = payout` / `payout.Batches.Add`) или сохранять payout раньше.", fail: "Не замечает или считает, что payout.Id уже заполнен после Add."}
    - {id: V4-h-decimal-numeric, kind: harm, unit: provider-type-mapping, what: "Свойства decimal (GrossKg, NetKg, PricePerKg, суммы Payout, AdvanceBalance) без HasPrecision/HasColumnType: в Npgsql decimal отображается на PostgreSQL numeric без ограничения точности, значения хранятся без усечения. Предупреждение EF о decimal без точности и усечение относятся к SQL Server. Ложная находка: «значения будут обрезаны, обязательно задать HasPrecision»."}
    - {id: V4-h-executeupdate-in-transaction, kind: harm, unit: bulk-update, what: "PayoutService.ApproveAsync: SaveChangesAsync для Payout и последующий ExecuteUpdateAsync для Batches выполняются внутри явной транзакции BeginTransactionAsync/CommitAsync, поэтому они атомарны; ExecuteUpdate исполняется сразу и не требует SaveChanges. Ложная находка: «ExecuteUpdate вне транзакции» или «изменения статуса партий не сохранятся без SaveChanges»."}
