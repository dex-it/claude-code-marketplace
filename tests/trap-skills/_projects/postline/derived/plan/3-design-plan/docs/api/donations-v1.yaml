openapi: 3.1.0
info: { title: Postline Donations API, version: 1.4.0 }
paths:
  /v1/donations:
    get:
      parameters:
        - { name: author_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Страница донатов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, amount, commission, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", description: "рубли, два знака" }
                        commission: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
                        created_at: { type: string, format: date-time }
                  page: { type: integer }
        "400": { description: Ошибка запроса }
