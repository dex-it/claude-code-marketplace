name: Validate Plugins

on:
  # Фильтр путей на pull_request - ловушка: чек required, и PR, чьи файлы под фильтр
  # не попали, не получает его вовсе и висит в BLOCKED навсегда (write-права bypass
  # не дают). Так уже было с docs-only PR. Поэтому перечень покрывает все нормативные
  # и артефактные пути, а не только те, что валидатор парсит: CLAUDE.md и run-claude/**
  # добавлены после того, как PR с одними промтами запуска завис без единого чека.
  # По той же причине здесь 'tools/**', а не 'tools/validate-*.js': README валидаторов
  # нормативен ровно так же, как их код, а под прежний шаблон не попадал.
  pull_request:
    paths:
      - 'plugins/**/*.md'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-agents.yml'
      - '**.sh'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'run-claude/**'
  push:
    branches:
      - main
    paths:
      - 'plugins/**/*.md'
      - 'tools/validate-*.js'
      - '**.sh'

jobs:
  validate:
    name: Validate agents and skills against frameworks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout иногда падает на git fetch с транзиентным 403 / "expected packfile"
      # во время инцидентов GitHub Actions. Повтор с паузой переживает кратковременные сбои;
      # финальная попытка без continue-on-error роняет job, если checkout реально недоступен.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Wait before checkout retry 1
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry 1)
        id: checkout_retry1
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Wait before checkout retry 2
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry1.outcome == 'failure'
        run: sleep 60

      - name: Checkout (retry 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate agents
        run: node tools/validate-agent.js all

      - name: Validate skills
        run: node tools/validate-skill.js all

      - name: Validate commands
        run: node tools/validate-command.js all

  shell-syntax:
    name: Shell scripts syntax check (bash -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bash -n ловит синтаксические ошибки без выполнения. Гейт против регрессий
      # портируемости shell (CRLF в shebang, незакрытые конструкции) на каждом PR,
      # который трогает .sh. Полная проверка на macOS/Windows - отдельная задача.
      - name: Syntax-check all shell scripts
        run: find . -path ./node_modules -prune -o -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
