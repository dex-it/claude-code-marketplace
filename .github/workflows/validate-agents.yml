name: Validate Plugins

on:
  # На pull_request фильтра путей нет намеренно. Оба чека этого workflow - required
  # с enforcement для всех, а required-чек, который не запустился, не считается
  # пройденным: PR, ни один файл которого не попал под фильтр, не получает чек вовсе
  # и висит в BLOCKED навсегда, write-права bypass не дают.
  # Перечислять пути под required-чеком не сходится: список расширяли четырежды и
  # каждый раз после того, как PR уже завис (docs-only, потом промты запуска, потом
  # README валидаторов, потом .claude/rules). На момент снятия фильтра мимо него
  # по-прежнему проходили README.md, mcp/**, adoption/**, tests/**, setup/** и часть
  # install-bundle/**. Прогон занимает порядка 20 секунд, экономить тут нечего.
  pull_request:
  # В push-блоке фильтр остаётся умышленно, и это не забытый хвост. Ловушка BLOCKED
  # специфична для pull_request: гейтом служит именно он. Прогон на main
  # пост-мерджевый и информационный, непопадание под фильтр здесь ничего не вешает.
  push:
    branches:
      - main
    paths:
      - 'plugins/**/*.md'
      - 'tools/validate-*.js'
      - '**.sh'

jobs:
  validate:
    name: Validate agents and skills against frameworks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout иногда падает на git fetch с транзиентным 403 / "expected packfile"
      # во время инцидентов GitHub Actions. Повтор с паузой переживает кратковременные сбои;
      # финальная попытка без continue-on-error роняет job, если checkout реально недоступен.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Wait before checkout retry 1
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry 1)
        id: checkout_retry1
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Wait before checkout retry 2
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry1.outcome == 'failure'
        run: sleep 60

      - name: Checkout (retry 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate agents
        run: node tools/validate-agent.js all

      - name: Validate skills
        run: node tools/validate-skill.js all

      - name: Validate commands
        run: node tools/validate-command.js all

      - name: Validate bundles
        run: node tools/validate-bundle.js all

      # Мета-гейт: правило без строки в VALIDATOR_RULES.md или без фикстуры
      # проходит test-rules.js молча - он гоняет только то, что заявлено.
      - name: Validate rules documented
        run: node tools/validate-rules-documented.js all

      # Прогон правил на фикстурах: на живом каталоге выключенное правило
      # неотличимо от соблюдённого, ловится только деревом с заведомым дефектом.
      - name: Test validator rules
        run: node tools/test-rules.js all

      # Стартовый индекс имён генерируется из словаря: правка словаря без
      # перегенерации даёт индекс, который расходится с домом молча.
      - name: Check terminology index in sync
        run: node tools/sync-terminology.js --check

      # Проба видимости агента платная и в CI не ходит, но перечень её кейсов
      # строится из дерева - и строился слепо к подкаталогу `agents/`. Предмет
      # этого шага - сам перечень: он собирается бесплатно (`--list-cases` в
      # песочнице через MARKETPLACE_ROOT), а кейс, которого не построилось,
      # ошибкой не выглядит нигде. Шаг живёт в этом job'е, а не в shell-syntax:
      # скрипт зовёт node и `gray-matter`, то есть требует `npm ci`.
      - name: Test agent visibility case construction
        run: npm run test:tools

      # README - второй носитель состава каталога, генератора у него нет.
      # Замер 01.09.2026 этим же инструментом на базе PR (b846fd6f): 85 плагинов
      # из 245 не были названы ни полным, ни коротким именем, и
      # `sync-marketplace --check` этого не видит - он судит только пару
      # plugin.json x marketplace.json.
      - name: Validate README against the catalog
        run: node tools/validate-readme.js all

      # Оба хука регрессируют своим адресом, разъехавшимся с прозой молча: resume-reminder -
      # адресом auto-ledger (текст движка vs код хука vs README хука), engine-nudge - условием
      # «молчим вне git-репозитория», снятым в 1.2.0 без отражения в платной пробе активации.
      # Через готовый npm-скрипт test:hooks, а не прямым bash - та же форма вызова, что у
      # остальных шагов job'а; job уже несёт npm ci, дублировать Setup Node.js/npm ci в
      # shell-syntax под эти два теста незачем.
      - name: Test hooks (resume-reminder, engine-nudge)
        run: npm run test:hooks

  shell-syntax:
    name: Shell scripts syntax check (bash -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bash -n ловит синтаксические ошибки без выполнения. Гейт против регрессий
      # портируемости shell (CRLF в shebang, незакрытые конструкции) на каждом PR,
      # который трогает .sh. Полная проверка на macOS/Windows - отдельная задача.
      - name: Syntax-check all shell scripts
        run: find . -path ./node_modules -prune -o -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
